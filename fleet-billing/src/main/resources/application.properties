# =============================================================================
#  Fleet Billing — Application Properties
#  Phase 1: Project Setup
#
#  IMPORTANT: Never commit real credentials to version control.
#  All sensitive values are read from environment variables.
#  A fallback default (after the colon) is provided ONLY for local development.
# =============================================================================

# -----------------------------------------------------------------------------
# Application Identity
# -----------------------------------------------------------------------------
spring.application.name=fleet-billing

# -----------------------------------------------------------------------------
# MySQL / Datasource Configuration
#
# Set these environment variables before running the application:
#   DB_URL      — e.g. jdbc:mysql://localhost:3306/fleet_billing
#   DB_USERNAME — e.g. root
#   DB_PASSWORD — your MySQL password (no default in production!)
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fleet_billing}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool — sensible defaults for development
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# -----------------------------------------------------------------------------
# JPA / Hibernate Configuration
#
# validate  — checks that the schema matches entities, but never changes it (safe for prod)
# update    — auto-creates / alters tables to match entities (convenient in dev)
# create    — drops and recreates tables on every start (use only in dev/test)
#
# We use 'update' for Phase 1 development so the app starts even without
# manual DDL. Switch to 'validate' and use Flyway/Liquibase in production.
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -----------------------------------------------------------------------------
# Redis Configuration
#
# Set these environment variables before running the application:
#   REDIS_HOST     — e.g. localhost
#   REDIS_PORT     — e.g. 6379
#   REDIS_PASSWORD — leave blank if Redis has no auth (common locally)
# -----------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

app.cache.contract-ttl-seconds=${CONTRACT_CACHE_TTL_SECONDS:600}
app.cache.pricing-ttl-seconds=${PRICING_CACHE_TTL_SECONDS:600}
app.cache.vehicle-ttl-seconds=${VEHICLE_CACHE_TTL_SECONDS:300}

# -----------------------------------------------------------------------------
# Spring Boot Actuator
#
# Exposes only safe, useful endpoints. Never expose 'env', 'beans',
# 'heapdump', or 'threaddump' without authentication in production.
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application info that appears on /actuator/info
info.app.name=Fleet Billing
info.app.description=Rental Fleet Billing and Fair Cost Split
info.app.version=0.0.1-SNAPSHOT

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
server.port=8089

# Custom context path for all API endpoints
server.servlet.context-path=/

# -----------------------------------------------------------------------------
# JWT Configuration
# -----------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItZmxlZXQtYmlsbGluZy1hcHBsaWNhdGlvbi0yMDI2}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# -----------------------------------------------------------------------------
# CORS Configuration
# -----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.com.fleetbilling=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -----------------------------------------------------------------------------
# Fraud Detection Configuration
# -----------------------------------------------------------------------------
fraud.enabled=${FRAUD_ENABLED:true}
fraud.max-trip-distance-km=${FRAUD_MAX_TRIP_DISTANCE_KM:1000}
fraud.max-trip-duration-minutes=${FRAUD_MAX_TRIP_DURATION_MINUTES:1440}
fraud.max-average-speed-kmph=${FRAUD_MAX_AVERAGE_SPEED_KMPH:150}

