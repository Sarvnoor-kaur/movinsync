# docker-compose.yml — Phase 1 (Application only)
#
# This file runs ONLY the fleet-billing application container.
# It assumes MySQL and Redis are already running on the host machine
# (e.g., installed locally or via Docker Desktop).
#
# Phase 2+ will add MySQL, Redis, Prometheus, and Grafana containers.
#
# Usage:
#   1. Copy .env.example to .env and fill in your values.
#   2. docker compose up --build
#   3. Test: curl http://localhost:8080/api/health

version: "3.9"

services:
  fleet-billing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet-billing-app
    ports:
      - "8080:8080"
    environment:
      # These values are read from the .env file (never hardcode secrets here)
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
