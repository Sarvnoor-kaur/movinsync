# =============================================================================
#  Fleet Billing — Test Application Properties
# =============================================================================

spring.application.name=fleet-billing-test

# Use H2 in-memory database for all tests so tests do not require MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable Redis auto-configuration during tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# JWT Test Configuration
jwt.secret=c3VwZXItc2VjcmV0LWtleS1mb3ItZmxlZXQtYmlsbGluZy1hcHBsaWNhdGlvbi0yMDI2
jwt.expiration-ms=3600000

# Fraud Detection Test Configuration
fraud.enabled=true
fraud.max-trip-distance-km=1000
fraud.max-trip-duration-minutes=1440
fraud.max-average-speed-kmph=150
